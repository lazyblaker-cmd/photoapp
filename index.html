<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="對比相機" />
  <meta name="theme-color" content="#111827" />
  <title>前後對齊對比相機</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="stylesheet" href="./style.css?v=8" />
</head>
<body>
  <div class="app-shell">
    <!-- 頂部三階段模式切換列 -->
    <header class="top-bar">
      <div class="mode-tabs">
        <button id="tab-step-1" class="mode-tab active" type="button">1. 拍前照 (<span id="count-before">0</span>)</button>
        <button id="tab-step-2" class="mode-tab" type="button">2. 對齊拍後照 (<span id="count-after">0</span>)</button>
        <button id="tab-step-3" class="mode-tab" type="button">3. 合成對比</button>
      </div>
      <button id="btn-reset" class="icon-btn" type="button" title="清空全部">清空</button>
    </header>

    <!-- 多組照片縮圖清單列（點選可切換要處理哪一組） -->
    <div id="slot-strip-bar" class="slot-strip-bar">
      <div id="slot-list" class="slot-list">
        <span class="slot-empty-hint">尚未拍攝「前 before」照片，請點畫面或按快門連續拍攝</span>
      </div>
    </div>

    <!-- 相機與疊圖拍攝區 (模式 1 & 2) -->
    <main id="camera-section" class="main-area">
      <div class="viewfinder-wrapper">
        <div id="viewfinder" class="viewfinder">
          <!-- 左側／疊圖：前照區塊 -->
          <div id="before-pane" class="before-pane hidden">
            <img id="before-overlay" class="before-overlay" alt="前 before" />
            <div class="grid-overlay split-only-grid">
              <div class="grid-line v1"></div>
              <div class="grid-line v2"></div>
              <div class="grid-line h1"></div>
              <div class="grid-line h2"></div>
            </div>
            <span class="pane-badge">前 before</span>
          </div>

          <!-- 右側／主畫面：即時鏡頭區塊 -->
          <div id="camera-pane" class="camera-pane">
            <video id="camera-video" autoplay playsinline muted></video>
            <div class="grid-overlay">
              <div class="grid-line v1"></div>
              <div class="grid-line v2"></div>
              <div class="grid-line h1"></div>
              <div class="grid-line h2"></div>
            </div>
            <span class="pane-badge after-badge">後 after</span>

            <!-- 模式 2 陀螺儀視覺對準準星 -->
            <div id="gyro-target-box" class="gyro-target-box hidden">
              <div class="gyro-ring">
                <div class="gyro-cross-h"></div>
                <div class="gyro-cross-v"></div>
                <div id="gyro-dot" class="gyro-dot"></div>
              </div>
              <div id="gyro-delta-badge" class="gyro-delta-badge">調整手機角度對準中心</div>
            </div>
          </div>

          <div id="mode-banner" class="mode-banner">模式 1：連續拍攝所有「前 before」照片</div>
        </div>
      </div>

      <!-- 陀螺儀角度讀數列（預設自動開啟顯示） -->
      <div id="gyro-hud" class="gyro-bar">
        <div id="gyro-readout" class="gyro-readout">
          <span id="gyro-text">🧭 陀螺儀定位自動偵測中...</span>
        </div>
      </div>

      <!-- 模式 2 專用：對齊顯示方式（重疊 vs 左前右後）與輔助控制 -->
      <div id="overlay-controls" class="overlay-controls hidden">
        <div class="align-mode-switch">
          <button id="btn-align-overlay" class="align-mode-btn active" type="button">⧉ 重疊半透明對齊</button>
          <button id="btn-align-split" class="align-mode-btn" type="button">◫ 左：前 before / 右：後 after</button>
        </div>

        <div id="opacity-slider-row" class="slider-row">
          <label for="opacity-slider">前照透明度</label>
          <input id="opacity-slider" type="range" min="0" max="100" value="45" />
          <span id="opacity-value">45%</span>
        </div>

        <div class="assist-row">
          <button id="btn-toggle-grid" class="small-btn active" type="button">九宮格線</button>
          <button id="btn-blink-before" class="small-btn" type="button">按住只看前照</button>
          <button id="btn-to-result" class="small-btn" type="button">查看此組對比</button>
        </div>
      </div>

      <!-- 底部快門與操作列 -->
      <div class="camera-actions">
        <label class="action-side-btn" for="file-before-input">
          <span id="lbl-album-btn">📁 相簿匯入</span>
          <input id="file-before-input" type="file" accept="image/*" multiple hidden />
        </label>

        <button id="btn-shutter" class="shutter-btn" type="button" aria-label="拍照">
          <span class="shutter-inner"></span>
        </button>

        <button id="btn-next-phase" class="action-side-btn primary-side-btn" type="button">
          <span>去拍後照 →</span>
        </button>
      </div>
    </main>

    <!-- 結果與合成對比區 (模式 3) -->
    <section id="result-section" class="main-area result-area hidden">
      <div class="result-options">
        <div class="segmented-control">
          <button type="button" class="seg-btn active" data-layout="horizontal">左右並排</button>
          <button type="button" class="seg-btn" data-layout="vertical">上下並排</button>
          <button type="button" class="seg-btn" data-layout="wipe">滑塊拉桿</button>
          <button type="button" class="seg-btn" data-layout="carousel">IG 滑動</button>
        </div>

        <div class="options-row">
          <label class="checkbox-label">
            <input id="chk-show-labels" type="checkbox" checked />
            <span>加上「前 before / 後 after」標籤</span>
          </label>
          <button id="btn-switch-cam" class="mini-link-btn" type="button">🔄 切換前後鏡頭</button>
        </div>
      </div>

      <!-- 合成後預覽圖 (左右並排 / 上下並排) -->
      <div id="combined-preview-box" class="preview-box">
        <img id="combined-result-img" alt="前後對比圖" />
        <p id="result-status-text" class="hint-text">提示：點上方縮圖可切換不同組照片，長按圖片或點下方按鈕可儲存</p>
      </div>

      <!-- 互動式前後對比滑塊拉桿 (Before / After Wipe Slider) -->
      <div id="wipe-preview-box" class="preview-box hidden">
        <div id="wipe-stage" class="wipe-stage">
          <img id="wipe-after-img" class="wipe-img" alt="後 after" draggable="false" />
          <img id="wipe-before-img" class="wipe-img wipe-before" alt="前 before" draggable="false" />
          <span id="wipe-tag-before" class="wipe-tag left">前 before</span>
          <span id="wipe-tag-after" class="wipe-tag right">後 after</span>
          <div id="wipe-divider" class="wipe-divider">
            <div class="wipe-handle">◀ ▶</div>
          </div>
        </div>
        <p class="hint-text">手指左右滑動分隔線可即時對比前後差異；點「分享此組對比照」可匯出目前分割畫面</p>
      </div>

      <!-- IG 多圖式左右滑動檢視 (Carousel) -->
      <div id="single-preview-box" class="ig-carousel-box hidden">
        <div class="ig-carousel-wrapper">
          <span id="ig-page-pill" class="ig-page-pill">1 / 2</span>
          <div id="ig-track" class="ig-track">
            <div class="ig-slide">
              <div class="ig-img-wrap">
                <span class="wipe-tag left">前 before</span>
                <img id="single-before-img" alt="前 before" />
              </div>
              <button id="btn-save-before" class="secondary-btn ig-save-btn" type="button">儲存「前 before」單張</button>
            </div>
            <div class="ig-slide">
              <div class="ig-img-wrap">
                <span class="wipe-tag right">後 after</span>
                <img id="single-after-img" alt="後 after" />
              </div>
              <button id="btn-save-after" class="secondary-btn ig-save-btn" type="button">儲存「後 after」單張</button>
            </div>
          </div>
        </div>
        <div class="ig-dots">
          <button type="button" class="ig-dot active" data-slide="0" aria-label="第 1 張"></button>
          <button type="button" class="ig-dot" data-slide="1" aria-label="第 2 張"></button>
        </div>
        <p class="hint-text">像 IG 一樣左右滑動切換「前 before」與「後 after」同角度大圖</p>
      </div>

      <div class="result-actions">
        <button id="btn-retake-after" class="secondary-btn" type="button">重拍此組後照</button>
        <button id="btn-share-combined" class="primary-btn" type="button">分享此組對比照</button>
        <button id="btn-share-all" class="accent-btn" type="button">批次分享全部</button>
      </div>
    </section>
  </div>

  <script src="./app.js?v=8"></script>
</body>
</html>
